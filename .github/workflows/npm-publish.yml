name: Publish Package to NPM Registry

on:
  release:
    types: [created]
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check-version.outputs.version_changed }}
      new_version: ${{ steps.check-version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for version change
        id: check-version
        run: |
          # Get current package.json version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Get version from previous commit
          git checkout HEAD~1 -- package.json
          PREVIOUS_VERSION=$(node -p "require('./package.json').version")
          echo "Previous version: $PREVIOUS_VERSION"

          # Reset the change
          git checkout HEAD -- package.json

          # Compare versions
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged: $CURRENT_VERSION"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  validate:
    needs: detect-version-change
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && needs.detect-version-change.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate version match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Package.json version ($PKG_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

  build:
    needs: [validate, detect-version-change]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && needs.detect-version-change.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  create-tag:
    needs: [detect-version-change, validate]
    if: |
      github.event_name == 'push' &&
      needs.detect-version-change.outputs.version_changed == 'true' &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Create and push tag
        run: |
          NEW_VERSION=${{ needs.detect-version-change.outputs.new_version }}
          echo "Creating tag v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release version $NEW_VERSION"
          git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git "v$NEW_VERSION"

  create-release:
    needs: [create-tag, detect-version-change]
    if: |
      github.event_name == 'push' &&
      needs.detect-version-change.outputs.version_changed == 'true' &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="$(git describe --tags --abbrev=0)" 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag, use all commits
            echo "changelog=$(git log --pretty=format:"* %s (%h)" | head -10 | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          else
            # If previous tag exists, use commits since that tag
            echo "changelog=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"* %s (%h)" | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.new_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true

  publish:
    needs: [build, detect-version-change]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && needs.detect-version-change.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from git history
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="$(git describe --tags --abbrev=0)" 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag, use all commits
            echo "changelog=$(git log --pretty=format:"* %s (%h)" | head -10 | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          else
            # If previous tag exists, use commits since that tag
            echo "changelog=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"* %s (%h)" | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release asset
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          tar -czf "${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz" dist/
          echo "ASSET_PATH=${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz" >> $GITHUB_ENV

      - name: Update release with changelog and assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.ASSET_PATH }}

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
